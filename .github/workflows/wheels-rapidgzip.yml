name: Build (and Publish) Wheels for rapidgzip

on:
  push:
    branches: 'main'
    tags: 'rapidgzip-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Check-Version:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive

    - name: Check source version against tag
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          python3 .github/workflows/check-version.py "${GITHUB_REF_NAME}" --check-changelog
        else
          python3 .github/workflows/check-version.py
        fi

  Tarball:
    needs: Check-Version
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'

    - name: Install Dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade-strategy eager --upgrade twine build

    - name: Build Tarball
      working-directory: python/rapidgzip
      run: python3 -m build --sdist

    - name: Check Wheels
      run: twine check --strict python/rapidgzip/dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: rapidgzip-tarball
        path: "python/rapidgzip/dist/*.tar.gz"
        if-no-files-found: error

  Wheels:
    needs: Check-Version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-26
        - macos-26-intel
        - ubuntu-24.04-arm
        - ubuntu-24.04
        - windows-latest
        archs: [auto64]
        manylinux-image: [manylinux_2_28]
        abi3: [false, true]
        # One runner per architecture is enough because MACOSX_DEPLOYMENT_TARGET pins the wheel tag. Building
        # on a newer macOS runner therefore does not raise the minimum supported macOS version, and using two
        # runners per architecture would only produce competing wheels with identical file names.
        #
        # manylinux1 is not supported anymore because it won't compile C++17 code
        # manylinux2010 runs into this problem https://github.com/pypa/cibuildwheel/issues/1001
        # MacOS and Windows ignore the manylinux-image version because they are not Linux.
        include:
        - os: ubuntu-24.04
          manylinux-image: manylinux_2_28
          archs: auto32
          abi3: false
        - os: ubuntu-24.04
          manylinux-image: manylinux_2_28
          archs: auto32
          abi3: true
    env:
      # By default, both build (https://pypi.org/project/build/)
      # and cibuildwheel (https://pypi.org/project/cibuildwheel/) seem to try to compile for macOS 10.9
      # based on the wheel output names in the logs. However, C++17 seems to have introduced some alignment
      # for classes, which results in this error for the GzipReader class itself even without "alignas" being used:
      # > error: aligned allocation function of type 'void *(std::size_t, std::align_val_t)'
      # >        is only available on macOS 10.14 or newer
      # See also this discussion https://bugs.chromium.org/p/chromium/issues/detail?id=1274388
      #
      # In the end, 10.9 support should not be necessary anymore in almost 2023. Apple-support for that seems
      # to have stopped 2016-12-01 (https://endoflife.date/macos) and even support for 10.14, which was introduced
      # in 2019-09-24 has already stopped in 2021-10-25, so more than a year ago.
      #
      # Release                  | Release Date  | End of Life
      # -------------------------+---------------+-------------
      # macOS 13 (Ventura)       | 2022-10-24    | some time after 2022-11
      # macOS 12 (Monterey)      | 2021-10-25    | some time after 2022-11
      # macOS 11 (Big Sur)       | 2020-11-12    | some time after 2022-11
      # macOS 10.15 (Catalina)   | 2019-10-07    | 2022-09-12
      # macOS 10.14 (Mojave)     | 2018-09-24    | 2021-10-25
      # macOS 10.13 (High Sierra)| 2017-09-25    | 2020-12-01
      # macOS 10.12 (Sierra)     | 2016-09-20    | 2019-10-01
      # OS X 10.11 (El Capitan)  | 2015-09-30    | 2018-12-01
      # OS X 10.10 (Yosemite)    | 2014-10-16    | 2017-08-01
      # OS X 10.9 (Mavericks)    | 2013-10-22    | 2016-12-01
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'

    - name: Install Dependencies
      # cibuildwheel-2.23.3 fails with:
      # Building cp38-macosx_arm64 wheel
      # Download https://github.com/pypa/get-virtualenv/blob/20.30.0/public/virtualenv.pyz?raw=true
      #  -> fails because it is 404 now :( This means I have to drop Python 3.8 support.
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade-strategy eager --upgrade cython twine check-wheel-contents abi3audit cibuildwheel~=4.3 build requests

    - name: Install NASM (Windows)
      if: "startsWith(matrix.os, 'windows')"
      run: |
        python3 .github/workflows/install-python-on-windows.py
        echo "${PWD}/nasm" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build Musllinux Wheels
      if: "startsWith(matrix.os, 'ubuntu')"
      env:
        # The Musllinux containers are based on Alpine and therefore
        # "apk add" needs to be used instead of "yum install".
        # https://cibuildwheel.readthedocs.io/en/stable/options/
        CIBW_ARCHS: ${{ matrix.archs }}
        CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux-image }}
        CIBW_BEFORE_ALL_LINUX: "uname -a; apk add nasm"
        CIBW_BUILD_VERBOSITY: 1
        CIBW_BUILD: ${{ matrix.abi3 && 'cp314-*musllinux*' || '*musllinux*' }}
        # Skip cp14t on Windows because it has problems:
        # https://github.com/pypa/cibuildwheel/issues/2676
        CIBW_SKIP: "*cp3??t-win*"
        CIBW_ENABLE: ${{ matrix.abi3 && '' || 'pypy' }}
        CIBW_ENVIRONMENT: ${{ matrix.abi3 && 'RAPIDGZIP_ABI3=enable' || '' }}
      run: python -m cibuildwheel --output-dir dist python/rapidgzip

    - name: Build CPython Wheels
      env:
        # https://cibuildwheel.readthedocs.io/en/stable/options/
        CIBW_ARCHS: ${{ matrix.archs }}
        CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux-image }}
        CIBW_BEFORE_ALL_LINUX: "uname -a; yum install -y nasm"
        CIBW_BEFORE_ALL_MACOS: |
          brew install nasm;
          export PATH="$PATH:/usr/local/bin"
        CIBW_BUILD_VERBOSITY: 1
        CIBW_BUILD: ${{ matrix.abi3 && 'cp314-*' || '*' }}
        # Skip cp14t on Windows because it has problems:
        # https://github.com/pypa/cibuildwheel/issues/2676
        CIBW_SKIP: "*musllinux* *cp3??t-win*"
        CIBW_ENABLE: ${{ matrix.abi3 && '' || 'pypy' }}
        CIBW_ENVIRONMENT: ${{ matrix.abi3 && 'RAPIDGZIP_ABI3=enable' || '' }}
      run: python -m cibuildwheel --output-dir dist python/rapidgzip

    - name: Check Distributions
      run: twine check --strict dist/*

    # delvewheel produces Windows wheels with Root-Is-Purelib: false and a .data/platlib directory,
    # which check-wheel-contents rejects as an invalid wheel even though pip installs it.
    - name: Check Wheel Contents
      if: "!startsWith(matrix.os, 'windows')"
      shell: bash
      run: |
        # auditwheel adds an <package>.libs/ directory to repaired wheels.
        # Ignore W003,W009,W010, which fail on musllinux.
        check-wheel-contents --no-config --ignore W003,W009,W010 dist/*.whl

    - name: Audit ABI3 wheels
      if: matrix.abi3
      shell: bash
      run: abi3audit --strict dist/*.whl

    - name: Install Wheel
      if: ${{ matrix.archs != 'auto32' }}
      run: python3 -m pip install --no-index --find-links dist rapidgzip

    - name: Test Wheel ISA-L support
      if: ${{ matrix.archs != 'auto32' && !startsWith(matrix.os, 'macos') }}
      shell: bash
      run: "rapidgzip --oss-attributions | grep -i ISA-L"

    - uses: actions/upload-artifact@v7
      with:
        name: wheels${{ matrix.abi3 && '-abi3' || '' }}-${{ matrix.os }}-${{ matrix.archs }}
        path: "dist/*.whl"
        if-no-files-found: error

  Publish:
    needs: [Tarball, Wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rapidgzip
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download all distributions
      uses: actions/download-artifact@v7
      with:
        path: dist
        merge-multiple: true

    - name: Publish to PyPI with provenance
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        attestations: true
        verify-metadata: false
        print-hash: true
        skip-existing: true

  # AUR deployment was removed because python-rapidgzip moved to the official Arch repository:
  # https://archlinux.org/packages/extra/x86_64/python-rapidgzip/
