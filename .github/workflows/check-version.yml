name: Check Version

on:
  push:
    branches: [ "main" ]
    tags: 'rapidgzip-v*.*.*'
  pull_request:
  workflow_dispatch:

jobs:
  Check-Version:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Check source version
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          python3 .github/workflows/check-version.py "${GITHUB_REF_NAME}" --check-changelog
        else
          python3 .github/workflows/check-version.py
        fi
